<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Professor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<style>
:root{
  --bg:#e8edf1; --grid:#d5dde4; --panel:#fbfcfd; --ink:#17283d; --muted:#5b6b7c; --line:#cfd8e0;
  --core:#b4531a; --core-bg:#fbf0e8; --ok:#1f7a4d; --ok-bg:#e6f4ec; --bad:#b3261e; --bad-bg:#fbeae9; --sel:#17283d;
  --serif:"Literata",Georgia,serif; --sans:"Figtree",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--sans);color:var(--ink);background:
  linear-gradient(var(--grid) 1px,transparent 1px) 0 0/28px 28px,
  linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/28px 28px,var(--bg);}
.app{display:grid;grid-template-columns:270px minmax(0,1fr) 360px;gap:14px;height:100vh;padding:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.panel h2{margin:0;font-size:13px;font-weight:600;color:var(--muted);padding:12px 16px;border-bottom:1px solid var(--line)}
.scroll{overflow:auto;min-height:0;flex:1}

/* tree */
.tree{padding:8px 8px 16px}
.node{display:block;width:100%;text-align:left;background:none;border:0;border-radius:4px;padding:7px 10px;font:inherit;font-size:14px;color:var(--ink);cursor:pointer;line-height:1.35}
.node:hover{background:#eef2f6}
.node.active{background:var(--sel);color:#fff}
.node.l1{font-weight:600;font-size:15px;padding-top:10px}
.node.l2{margin-left:8px}
.node.l3{margin-left:26px;font-size:13px;color:var(--muted);border-left:2px solid var(--line);border-radius:0 4px 4px 0}
.node.l3.active{color:#fff;border-left-color:var(--sel)}

/* main */
.head{padding:18px 28px 0}
.head .kind{font-size:13px;color:var(--muted)}
.head h1{font-family:var(--serif);font-weight:600;font-size:28px;line-height:1.2;margin:4px 0 14px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 28px}
.tab{background:none;border:0;border-bottom:3px solid transparent;font:inherit;font-weight:500;font-size:14px;color:var(--muted);padding:10px 14px;cursor:pointer;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--ink);border-bottom-color:var(--core)}
.body{padding:24px 28px 40px;font-family:var(--serif);font-size:16.5px;line-height:1.65;max-width:760px}
.body p{margin:0 0 1em}
.empty{color:var(--muted);font-family:var(--sans)}

/* key points */
.group-title{font-family:var(--sans);font-size:14px;font-weight:600;margin:0 0 10px}
.kp{list-style:none;margin:0 0 28px;padding:0}
.kp li{padding:12px 16px;margin-bottom:8px;border-radius:4px;background:#f1f4f7;border-left:4px solid var(--line)}
.kp.core li{background:var(--core-bg);border-left-color:var(--core)}
.cta{font-family:var(--sans);margin-top:8px}
button.primary{font:inherit;font-weight:600;font-size:14px;background:var(--ink);color:#fff;border:0;border-radius:4px;padding:10px 18px;cursor:pointer}
button.primary:hover{background:#25405f}
button.ghost{font:inherit;font-size:14px;background:none;border:1px solid var(--line);border-radius:4px;padding:9px 16px;cursor:pointer;color:var(--ink)}
button.ghost:hover{border-color:var(--ink)}
:focus-visible{outline:2px solid var(--core);outline-offset:2px}

/* text */
.src{font-size:16px}
.src h1,.src h2,.src h3{font-family:var(--sans);line-height:1.3}
.src h2{font-size:20px;margin-top:1.6em}.src h3{font-size:17px;margin-top:1.4em}

/* videos */
.vid{font-family:var(--sans);margin-bottom:22px}
.vid iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:4px;background:#000}
.vid .t{font-weight:600;font-size:14px;margin:8px 0 2px}.vid .c{font-size:13px;color:var(--muted)}
.qlink{display:block;font-family:var(--sans);font-size:15px;padding:12px 14px;margin-bottom:8px;border:1px solid var(--line);border-radius:4px;color:var(--ink);text-decoration:none;background:#fff}
.qlink:hover{border-color:var(--ink)}
.note{font-family:var(--sans);font-size:13px;color:var(--muted);margin:0 0 14px}

/* quiz */
.quiz{font-family:var(--sans)}
.quiz .progress{font-size:13px;color:var(--muted);margin-bottom:10px}
.quiz .q{font-family:var(--serif);font-size:18px;line-height:1.5;margin-bottom:16px}
.opt{display:block;width:100%;text-align:left;font:inherit;font-size:15px;line-height:1.45;background:#fff;border:1.5px solid var(--line);border-radius:4px;padding:12px 14px;margin-bottom:8px;cursor:pointer;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.expl{margin:14px 0;padding:12px 14px;border-radius:4px;background:#f1f4f7;font-size:14.5px;line-height:1.55}
.score{font-family:var(--serif);font-size:32px;margin:6px 0 14px}

/* chat */
.msgs{padding:14px;display:flex;flex-direction:column;gap:10px}
.m{max-width:92%;padding:9px 12px;border-radius:6px;font-size:14.5px;line-height:1.5}
.m p{margin:0 0 .6em}.m p:last-child{margin:0}
.m.user{align-self:flex-end;background:var(--ink);color:#fff}
.m.bot{align-self:flex-start;background:#eef2f6}
.m.refuse{background:var(--bad-bg)}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px}
.chip{font:inherit;font-size:13px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:5px 11px;cursor:pointer;color:var(--ink)}
.chip:hover{border-color:var(--ink)}
.composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.composer input{flex:1;font:inherit;font-size:14.5px;padding:10px 12px;border:1px solid var(--line);border-radius:4px;min-width:0}
.ctx{font-size:12.5px;color:var(--muted);padding:0 14px 8px}

@media (max-width:1100px){
  .app{grid-template-columns:240px minmax(0,1fr);grid-template-rows:minmax(0,1fr) 380px;height:auto;min-height:100vh}
  .chatp{grid-column:1 / -1}
}
@media (max-width:700px){
  .app{grid-template-columns:1fr;grid-template-rows:auto}
  .panel{max-height:none}.treep .scroll{max-height:240px}
  .head,.tabs,.body{padding-left:16px;padding-right:16px}
}
</style>
</head>
<body>
<div class="app">
  <nav class="panel treep" aria-label="Topics">
    <h2>Course topics</h2>
    <div class="scroll"><div class="tree" id="tree"></div></div>
  </nav>

  <main class="panel">
    <div class="head"><div class="kind" id="kind"></div><h1 id="title">Select a topic</h1></div>
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="scroll"><div class="body" id="body"><p class="empty">Pick a chapter, subchapter or example on the left.</p></div></div>
  </main>

  <aside class="panel chatp" aria-label="Ask the professor">
    <h2>Ask the professor</h2>
    <div class="scroll" id="msgsWrap"><div class="msgs" id="msgs"></div></div>
    <div class="ctx" id="ctx"></div>
    <div class="chips" id="chips"></div>
    <form class="composer" id="form">
      <input id="input" placeholder="Ask about this chapter…" autocomplete="off" aria-label="Your question">
      <button class="primary" type="submit">Send</button>
    </form>
  </aside>
</div>

<script>
const KIND = {chapter:"Chapter", subchapter:"Subchapter", example:"Example", section:"Section", exercises:"Exercises"};
let topics = [], byId = {}, current = null, tab = "points", history = [];
let quiz = null;
const $ = id => document.getElementById(id);

/* markdown + math: protect $...$ from marked (underscores!), restore, then let KaTeX render */
function md(src){
  const stash = [];
  const keep = s => { stash.push(s); return `@@M${stash.length-1}@@`; };
  src = src.replace(/\$\$[\s\S]+?\$\$/g, keep).replace(/\$[^$\n]+?\$/g, keep);
  let html = marked.parse(src, {breaks:false});
  return html.replace(/@@M(\d+)@@/g, (_, i) => stash[i].replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"));
}
function math(el){
  if (window.renderMathInElement) renderMathInElement(el, {delimiters:[
    {left:"$$",right:"$$",display:true},{left:"$",right:"$",display:false}], throwOnError:false});
}
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const inline = s => md(s).trim().replace(/^<p>|<\/p>$/g,"");

async function init(){
  topics = await (await fetch("/api/topics")).json();
  topics.forEach(t => byId[t.id] = t);
  $("tree").innerHTML = topics.map(t =>
    `<button class="node l${t.level}" data-id="${t.id}">${esc(t.title)}</button>`).join("");
  $("tree").addEventListener("click", e => { const b = e.target.closest(".node"); if (b) select(b.dataset.id); });
  say("bot", "Hi! Select a topic and I’ll show its key points. Ask me anything about this chapter.");
  select(topics[0].id);
}

function select(id){
  current = byId[id]; quiz = null;
  document.querySelectorAll(".node").forEach(n => n.classList.toggle("active", n.dataset.id === id));
  $("kind").textContent = KIND[current.type] || "";
  $("title").textContent = current.title;
  $("ctx").textContent = "Context: " + current.title;
  const hasC = !!current.content;
  const tabs = [["points","Key points",hasC],["text","Source text",true],["videos","Videos",hasC],["quiz","Test yourself",hasC && current.content.mcqs.length>0]]
    .filter(t => t[2]);
  if (!tabs.find(t => t[0] === tab)) tab = tabs[0][0];
  if (hasC) tab = "points";                               // selecting a topic always opens its key points first
  else tab = "text";
  $("tabs").innerHTML = tabs.map(([k,l]) => `<button class="tab" role="tab" data-t="${k}">${l}</button>`).join("");
  $("tabs").onclick = e => { const b = e.target.closest(".tab"); if (b){ tab = b.dataset.t; render(); } };
  renderChips(); render();
  $("body").parentElement.scrollTop = 0;
}

function render(){
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.t === tab));
  const c = current.content, el = $("body");
  if (tab === "points"){
    const core = c.key_points.filter(k => k.core), rest = c.key_points.filter(k => !k.core);
    el.innerHTML = `<h3 class="group-title">Must know</h3><ul class="kp core">${core.map(k=>`<li>${inline(k.text)}</li>`).join("")}</ul>` +
      (rest.length ? `<h3 class="group-title">Also worth knowing</h3><ul class="kp">${rest.map(k=>`<li>${inline(k.text)}</li>`).join("")}</ul>` : "") +
      (c.mcqs.length ? `<div class="cta"><button class="primary" id="goQuiz">Test yourself (${c.mcqs.length} questions)</button></div>` : "");
    const g = $("goQuiz"); if (g) g.onclick = () => { tab = "quiz"; render(); };
  } else if (tab === "text"){
    el.innerHTML = `<div class="src">${md(current.full_text)}</div>`;
  } else if (tab === "videos"){
    renderVideos(el);
  } else if (tab === "quiz"){
    renderQuiz(el);
  }
  math(el);
}

async function renderVideos(el){
  el.innerHTML = `<p class="empty">Looking for videos…</p>`;
  const id = current.id;
  const d = await (await fetch(`/api/videos/${id}`)).json();
  if (current.id !== id || tab !== "videos") return;
  let h = "";
  if (d.videos.length){
    h += d.videos.map(v => `<div class="vid"><iframe src="https://www.youtube-nocookie.com/embed/${v.id}" title="${esc(v.title)}" allowfullscreen loading="lazy"></iframe>
      <div class="t">${esc(v.title)}</div><div class="c">${esc(v.channel)}</div></div>`).join("");
    h += `<p class="note">These are search results, not guaranteed to match the text exactly.</p>`;
  } else {
    h += `<p class="note">YouTube searches tailored to this topic. (Set YOUTUBE_API_KEY on the server to embed results here.)</p>`;
  }
  h += d.queries.map(q => `<a class="qlink" href="${q.url}" target="_blank" rel="noopener">${esc(q.q)}</a>`).join("");
  el.innerHTML = h;
}

/* quiz */
function renderQuiz(el){
  const qs = current.content.mcqs;
  if (!quiz) quiz = {i:0, score:0, picked:null};
  if (quiz.i >= qs.length){
    el.innerHTML = `<div class="quiz"><div class="progress">Finished</div><div class="score">${quiz.score} / ${qs.length}</div>
      <button class="primary" id="again">Try again</button> <button class="ghost" id="back">Review key points</button></div>`;
    $("again").onclick = () => { quiz = null; render(); };
    $("back").onclick = () => { tab = "points"; render(); };
    return;
  }
  const q = qs[quiz.i], done = quiz.picked !== null;
  el.innerHTML = `<div class="quiz"><div class="progress">Question ${quiz.i+1} of ${qs.length}</div>
    <div class="q">${inline(q.question)}</div>
    ${q.options.map((o,k)=>`<button class="opt ${done ? (k===q.answer_index?"ok":(k===quiz.picked?"bad":"")) : ""}" data-k="${k}" ${done?"disabled":""}>${inline(o)}</button>`).join("")}
    ${done ? `<div class="expl"><strong>${quiz.picked===q.answer_index?"Correct.":"Not quite."}</strong> ${inline(q.explanation)}</div>
      <button class="primary" id="next">${quiz.i+1<qs.length?"Next question":"See score"}</button>` : ""}</div>`;
  el.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    quiz.picked = +b.dataset.k; if (quiz.picked === q.answer_index) quiz.score++; render();
  });
  const n = $("next"); if (n) n.onclick = () => { quiz.i++; quiz.picked = null; render(); };
}

/* chat */
function renderChips(){
  const base = ["Explain this more simply","Give me another example"];
  $("chips").innerHTML = base.map(t => `<button class="chip" type="button">${t}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b => b.onclick = () => ask(b.textContent));
}
function say(who, text, cls=""){
  const d = document.createElement("div");
  d.className = `m ${who} ${cls}`;
  d.innerHTML = who === "bot" ? md(text) : esc(text);
  $("msgs").appendChild(d); math(d);
  $("msgsWrap").scrollTop = $("msgsWrap").scrollHeight;
  return d;
}
async function ask(text){
  text = text.trim(); if (!text) return;
  say("user", text); $("input").value = "";
  const wait = say("bot", "…");
  try{
    const r = await fetch("/api/chat", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({message:text, topic_id: current && current.id, history})});
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    wait.remove(); say("bot", d.answer, d.in_scope ? "" : "refuse");
    if (d.in_scope){ history.push({role:"user",content:text},{role:"assistant",content:d.answer}); history = history.slice(-8); }
  } catch(e){ wait.remove(); say("bot", "Something went wrong talking to the server. Check the terminal for errors.", "refuse"); }
}
$("form").onsubmit = e => { e.preventDefault(); ask($("input").value); };

init();
</script>
</body>
</html>
